
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
.showcase{font-family:'DM Sans',var(--font-sans);padding:1rem 0;color:#fff;background:#000;border-radius:var(--border-radius-lg)}
.header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding:0 1rem 1rem;border-bottom:0.5px solid rgba(255,255,255,.1)}
.avatar{width:40px;height:40px;border-radius:50%;background:#CECBF6;display:flex;align-items:center;justify-content:center;color:#3C3489;font-size:17px;flex-shrink:0}
.model-name{font-family:'DM Serif Display',serif;font-size:16px;font-weight:400;color:#fff}
.model-sub{font-size:10px;color:rgba(255,255,255,.5);margin-top:1px;text-transform:uppercase;letter-spacing:.05em}
.badge{background:rgba(206,203,246,.15);color:#CECBF6;font-size:10px;font-weight:500;padding:3px 10px;border-radius:20px;margin-left:auto}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:1rem;padding:0 1rem}
.stat-card{background:rgba(255,255,255,.07);border-radius:var(--border-radius-md);padding:9px 6px;text-align:center}
.stat-label{font-size:9px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px;font-weight:500}
.stat-value{font-family:'DM Serif Display',serif;font-size:17px;font-weight:400;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 1rem}
.video-card{background:#111;border-radius:var(--border-radius-md);border:0.5px solid rgba(255,255,255,.08);overflow:hidden;cursor:pointer}
.video-card:active{opacity:.8}
.video-thumb-player{position:relative;width:100%;aspect-ratio:9/16;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000}
.video-thumb-player video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.video-thumb-player video.playing{opacity:1}
.blur-cover{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;transition:opacity .25s}
.blur-cover.hidden{opacity:0;pointer-events:none}
.blur-bg{position:absolute;inset:0;filter:blur(16px);transform:scale(1.15);opacity:.6}
.blur-icon{font-size:24px;opacity:.4;position:relative;z-index:1}
.thumb-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
.thumb-play-circle{width:34px;height:34px;border-radius:50%;background:#7F77DD;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;box-shadow:0 2px 12px rgba(127,119,221,.4)}
.num-badge{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;padding:2px 5px;border-radius:3px;font-weight:500;z-index:4}
.card-info{padding:6px 8px 8px;background:#111}
.card-title{font-size:11px;font-weight:500;margin-bottom:1px;color:#fff}
.card-meta{font-size:10px;color:rgba(255,255,255,.4)}
.card-likes{color:#AFA9EC}
.cta-section{margin-top:1.5rem;border-top:0.5px solid rgba(255,255,255,.1);padding:1.5rem 1rem;display:flex;flex-direction:column;align-items:center;gap:1.25rem}
.cta-title{font-family:'DM Serif Display',serif;font-size:19px;font-weight:400;font-style:italic;text-align:center;line-height:1.3;color:#fff}
.cta-video-wrap{width:170px;aspect-ratio:9/16;border-radius:var(--border-radius-lg);overflow:hidden;border:0.5px solid rgba(255,255,255,.15);background:#0a0a0a;position:relative;cursor:pointer}
.cta-video-wrap video{width:100%;height:100%;object-fit:cover}
.cta-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);transition:opacity .2s}
.cta-play-overlay.hidden{opacity:0;pointer-events:none}
.cta-play-circle{width:46px;height:46px;border-radius:50%;background:#7F77DD;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px}
.cta-btn{display:inline-flex;align-items:center;gap:8px;background:#534AB7;color:#fff;font-family:'DM Sans',var(--font-sans);font-size:13px;font-weight:500;padding:11px 22px;border-radius:var(--border-radius-lg);border:none;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:background .15s}
.cta-btn:active{background:#3C3489}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

#fs-overlay{display:none;position:fixed;inset:0;background:#000;z-index:9999;flex-direction:column;align-items:center;justify-content:center}
#fs-overlay.open{display:flex}
#fs-video{width:100%;height:100%;object-fit:contain;display:block}
#fs-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:10}
#fs-info{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font-size:12px}
</style>

<div class="showcase">
  <h2 class="sr-only">Portfólio de vídeos</h2>
  <div class="header">
    <div class="avatar"><i class="ti ti-video" aria-hidden="true"></i></div>
    <div>
      <div class="model-name">Criador de Conteúdo</div>
      <div class="model-sub">Portfólio de vídeos</div>
    </div>
    <span class="badge">✦ Destaque</span>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Vídeos</div><div class="stat-value">13</div></div>
    <div class="stat-card"><div class="stat-label">Views</div><div class="stat-value">4,2k</div></div>
    <div class="stat-card"><div class="stat-label">Curtidas</div><div class="stat-value">1,8k</div></div>
    <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value">47min</div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="cta-section">
    <div class="cta-title">Confira o vídeo em destaque</div>
    <div class="cta-video-wrap" id="cta-card">
      <video id="cta-video" playsinline preload="none" loop
        src="https://video.gumlet.io/68d074662b33c1c8577508ae/69fbd399dfcf77865dc98f32/download.mp4"></video>
      <div class="cta-play-overlay" id="cta-overlay">
        <div class="cta-play-circle"><i class="ti ti-player-play" aria-hidden="true"></i></div>
      </div>
    </div>
    <button class="cta-btn"><i class="ti ti-player-play" aria-hidden="true"></i> Ver todos os vídeos</button>
  </div>
</div>

<div id="fs-overlay">
  <button id="fs-close" aria-label="Fechar"><i class="ti ti-x"></i></button>
  <video id="fs-video" playsinline controls></video>
  <div id="fs-info"></div>
</div>

<script>
const videos=[
  {id:1,src:"https://video.gumlet.io/68d074662b33c1c8577508ae/69fbd058c24b7e4dd4a03587/download.mp4",likes:312,views:"1,1k",icon:"ti-camera",bg:"#CECBF6",ic:"#534AB7"},
  {id:2,src:"https://video.gumlet.io/68d074662b33c1c8577508ae/69fbd058347ef2c1f860c825/download.mp4",likes:241,views:"890",icon:"ti-moon-stars",bg:"#B5D4F4",ic:"#185FA5"},
  {id:3,src:"https://video.gumlet.io/68d074662b33c1c8577508ae/69fbd058c24b7e4dd4a0358c/download.mp4",likes:189,views:"670",icon:"ti-leaf",bg:"#9FE1CB",ic:"#0F6E56"},
  {id:4,src:"https://video.gumlet.io/68d074662b33c1c8577508ae/69fbd059c24b7e4dd4a035a5/download.mp4",likes:298,views:"952",icon:"ti-sparkles",bg:"#F4C0D1",ic:"#993556"},
  {id:5,src:"https://video.gumlet.io/68d074662b33c1c8577508ae/69fbd059347ef2c1f860c82e/download.mp4",likes:175,views:"540",icon:"ti-sun",bg:"#FAC775",ic:"#854F0B"},
  {id:6,src:"https://video.gumlet.io/68d074662b33c1c8577508ae/69fbd059c24b7e4dd4a035ae/download.mp4",likes:220,views:"780",icon:"ti-mountain",bg:"#CECBF6",ic:"#534AB7"},
  {id:7,src:"https://video.gumlet.io/68d074662b33c1c8577508ae/69fbd059347ef2c1f860c830/download.mp4",likes:155,views:"420",icon:"ti-camera",bg:"#F5C4B3",ic:"#993C1D"},
  {id:8,src:"https://video.gumlet.io/68d074662b33c1c8577508ae/69fbd059dfcf77865dc96269/download.mp4",likes:344,views:"1,3k",icon:"ti-droplet",bg:"#B5D4F4",ic:"#185FA5"},
  {id:9,src:"https://video.gumlet.io/68d074662b33c1c8577508ae/69fbd059dfcf77865dc96267/download.mp4",likes:112,views:"310",icon:"ti-coffee",bg:"#9FE1CB",ic:"#0F6E56"},
  {id:10,src:"https://video.gumlet.io/68d074662b33c1c8577508ae/69fbd059dfcf77865dc9626e/download.mp4",likes:401,views:"1,5k",icon:"ti-star",bg:"#FAC775",ic:"#854F0B"},
  {id:11,src:"https://video.gumlet.io/68d074662b33c1c8577508ae/69fbd059dfcf77865dc96265/download.mp4",likes:98,views:"280",icon:"ti-brightness",bg:"#F4C0D1",ic:"#993556"},
  {id:12,src:"https://video.gumlet.io/68d074662b33c1c8577508ae/69fbd17e347ef2c1f860d97a/download.mp4",likes:267,views:"860",icon:"ti-camera",bg:"#CECBF6",ic:"#534AB7"},
  {id:13,src:"https://video.gumlet.io/68d074662b33c1c8577508ae/69fbd17ec24b7e4dd4a04607/download.mp4",likes:329,views:"1,1k",icon:"ti-heart",bg:"#F4C0D1",ic:"#993556"},
];

const grid=document.getElementById("grid");
const fsOverlay=document.getElementById("fs-overlay");
const fsVideo=document.getElementById("fs-video");
const fsInfo=document.getElementById("fs-info");
const fsClose=document.getElementById("fs-close");

grid.innerHTML=videos.map(v=>`
  <div class="video-card" data-id="${v.id}">
    <div class="video-thumb-player" data-src="${v.src}" data-id="${v.id}">
      <video preload="none" playsinline muted loop></video>
      <div class="blur-cover">
        <div class="blur-bg" style="background:${v.bg}"></div>
        <i class="ti ${v.icon} blur-icon" style="color:${v.ic}" aria-hidden="true"></i>
        <div class="thumb-play"><div class="thumb-play-circle"><i class="ti ti-player-play" aria-hidden="true"></i></div></div>
      </div>
      <span class="num-badge">${String(v.id).padStart(2,"0")}</span>
    </div>
    <div class="card-info">
      <div class="card-title">Vídeo ${v.id}</div>
      <div class="card-meta">${v.views} · <span class="card-likes">${v.likes} ♥</span></div>
    </div>
  </div>
`).join("");

function openFullscreen(v){
  fsVideo.src=v.src;
  fsInfo.textContent=`Vídeo ${v.id} · ${v.views} views · ${v.likes} curtidas`;
  fsOverlay.classList.add("open");
  fsVideo.load();
  fsVideo.play();
  if(fsVideo.requestFullscreen){fsVideo.requestFullscreen().catch(()=>{});}
  else if(fsVideo.webkitEnterFullscreen){fsVideo.webkitEnterFullscreen();}
}

function closeFS(){
  fsVideo.pause();
  fsOverlay.classList.remove("open");
  fsVideo.removeAttribute("src");
  fsVideo.load();
  if(document.exitFullscreen&&document.fullscreenElement){document.exitFullscreen().catch(()=>{});}
}

document.addEventListener("fullscreenchange",()=>{
  if(!document.fullscreenElement)closeFS();
});

fsClose.addEventListener("click",closeFS);
fsOverlay.addEventListener("click",e=>{if(e.target===fsOverlay)closeFS();});

grid.querySelectorAll(".video-thumb-player").forEach(tp=>{
  tp.addEventListener("click",e=>{
    e.stopPropagation();
    const vid=videos[parseInt(tp.dataset.id)-1];
    openFullscreen(vid);
  });
});

const ctaCard=document.getElementById("cta-card");
const ctaVideo=document.getElementById("cta-video");
const ctaOverlay=document.getElementById("cta-overlay");
ctaCard.addEventListener("click",()=>{
  if(ctaVideo.paused){ctaVideo.play();ctaOverlay.classList.add("hidden");}
  else{ctaVideo.pause();ctaOverlay.classList.remove("hidden");}
});
ctaVideo.addEventListener("ended",()=>ctaOverlay.classList.remove("hidden"));
</script>
